{% extends "base.html" %}

{% block titulo %}{{ NOMBRE_SITIO }} - Registro{% endblock %}

{% block contenido %}
<div class="content-card" style="max-width:500px; margin:0 auto;">
    <h2 style="text-align:center;">Crear cuenta</h2>
    <p class="sub" style="text-align:center;">Regístrate para comenzar a usar el sistema</p>

    <form action="/registro" method="POST">
        <div class="form-group">
            <label for="nombre">Nombre completo <span class="required">*</span></label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group" style="margin-top:14px;">
            <label for="email">Correo electrónico <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="Ej. correo@ejemplo.com" required>
        </div>

        <div class="form-group" style="margin-top:14px;">
            <label for="password">Contraseña <span class="required">*</span></label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="form-group" style="margin-top:14px;">
            <label for="confirmar_password">Confirmar contraseña <span class="required">*</span></label>
            <input type="password" id="confirmar_password" name="confirmar_password" placeholder="Repite la contraseña" required>
        </div>

        <button type="submit" class="btn-submit" style="margin-top:20px;">Registrarse</button>
    </form>

    <p style="text-align:center; margin-top:16px; color:#6a7a8a; font-size:0.9rem;">
        ¿Ya tienes cuenta? <a href="/login" style="color:#C9A84C; font-weight:600; text-decoration:none;">Iniciar sesión</a>
    </p>
</div>
{% endblock %}
