{% extends "base.html" %}

{% block titulo %}{{ NOMBRE_SITIO }} - Iniciar sesión{% endblock %}

{% block contenido %}
<div class="content-card" style="max-width:450px; margin:0 auto;">
    <h2 style="text-align:center;">Iniciar sesión</h2>
    <p class="sub" style="text-align:center;">Accede a tu cuenta para gestionar tus consultas</p>

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="email">Correo electrónico <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="Ej. correo@ejemplo.com" required>
        </div>

        <div class="form-group" style="margin-top:14px;">
            <label for="password">Contraseña <span class="required">*</span></label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button type="submit" class="btn-submit" style="margin-top:20px;">Iniciar sesión</button>
    </form>

    <p style="text-align:center; margin-top:16px; color:#6a7a8a; font-size:0.9rem;">
        ¿No tienes cuenta? <a href="/registro" style="color:#C9A84C; font-weight:600; text-decoration:none;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
